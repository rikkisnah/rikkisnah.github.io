baseURL = 'https://rikkisnah.github.io/'
title = 'Rik Kisnah - Blog'
author = 'Rik Kisnah'
languageCode = 'en'
DefaultContentLanguage = 'en'
enableInlineShortcodes = true
ignoreErrors = ["error-remote-getjson"]

theme = 'hugo-paper'

[pagination]
  pagerSize = 10

[params]
  color = 'light'
  theme = 'light'
  name = 'Rik Kisnah'
  bio = 'Engineer, husband, father. Building AI/GPU cloud infrastructure by day, sharing lessons learned by night. Faith and family first.'
  linkedin = 'rikkisnah'
  github = 'rikkisnah'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "/publications/"
    weight = 25
  [[menu.main]]
    identifier = "resume"
    name = "Resume"
    url = "/resume/"
    weight = 30
  [[menu.main]]
    identifier = "podcast"
    name = "Podcast"
    url = "/podcast/"
    weight = 35

[taxonomies]
category = "categories"
tag = "tags"

# Podcast Configuration
[params.podcast]
  title = "Kisnah Family Podcast"
  author = "Rik Kisnah"
  email = "rik.kisnah@gmail.com"
  description = "Stories, celebrations, and reflections from the Kisnah family"
  language = "en-us"
  category = "Family"
  subcategory = "Personal Journals"
  explicit = "no"
  cover = "/images/podcast/cover.png"

# Output formats for RSS
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[mediaTypes."application/rss+xml"]
  suffixes = ["xml"]
